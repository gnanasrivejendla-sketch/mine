<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Message For You ❤️</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="hearts">💗</div>

  <main class="card">
    <h1>Oo,hello💖</h1>
    <p id="message">I have a little update just for you...</p>

    <button id="openBtn" onclick="showVerification()">
      OPEN 
    </button>

    <div id="verification" class="hidden">
      <p>Only my special person knows the secret! 💌</p>
      <input
        type="password"
        id="code"
        placeholder="Enter secret code"
        autocomplete="off"
      >
      <button onclick="checkCode()">Unlock ❤️</button>
      <p id="error"></p>
    </div>

    <div id="surprise" class="hidden">
      <h2>For Mine! </h2>
      <img src="c:\Users\mypc\OneDrive\Pictures\neww.PNG" alt="ece-a">
      <p class="love-message">
         Every time i choose a new way to disturb you heeeee. 🫶
      </p>
      <div class="big-heart">❤️</div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
<style>{
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
  font-family: "Segoe UI", sans-serif;
  background: linear-gradient(135deg, #eee8e8, #d6d1e0, #fff1d6);
  color: #e5d6dd;
  text-align: center;
}

img{
  height: 300px;
  width: auto;
}
.card {
  width: 100%;
  max-width: 540px;
  padding: 40px 32px;
  background: rgba(28, 27, 28, 0.88);
  border: 2px solid white;
  border-radius: 38px;
  box-shadow: 0 15px 45px #0e0e0e30;
  animation: appear 0.8s ease;
}

h1 {
  color: #efe9ed;
  font-size: 27px;
}

p {
  line-height: 1.7;
}

button {
  border: none;
  border-radius: 30px;
  padding: 14px 22px;
  margin-top: 12px;
  background: #070707;
  color: white;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  background: #090909;
  transform: scale(1.04);
}

input {
  width: 100%;
  padding: 13px;
  margin-top: 10px;
  border: 2px solid #0b0b0b;
  border-radius: 12px;
  outline: none;
  font-size: 16px;
  text-align: center;
}

.hidden {
  display: none;
}

#surprise img {
  display: block;
  width: 100%;
  max-height: 380px;
  object-fit: cover;
  border-radius: 18px;
  margin-top: 18px;
  border: 4px solid #ffd3e5;
}

.love-message {
  color: #f8f3f3;
  font-size: 17px;
}

.big-heart {
  font-size: 40px;
  animation: heartbeat 1s infinite;
}

.hearts {
  position: fixed;
  top: 20px;
  font-size: 24px;
}

#error {
  color: #d12c52;
}

@keyframes heartbeat {
  50% { transform: scale(1.2); }
}

@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(15px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
</style>
<script class="js">const SECRET_CODE = "16092006"; // Change this to your secret code

function showVerification() {
  document.getElementById("openBtn").classList.add("hidden");
  document.getElementById("verification").classList.remove("hidden");
  document.getElementById("message").textContent =
    "Enter our secret code to unlock  💌";
  document.getElementById("code").focus();
}

function checkCode() {
  const enteredCode = document.getElementById("code").value;

  if (enteredCode === SECRET_CODE) {
    document.getElementById("verification").classList.add("hidden");
    document.getElementById("surprise").classList.remove("hidden");
    document.getElementById("message").textContent =
      "You unlocked something special! 🥰";
  } else {
    document.getElementById("error").textContent =
      "Oops! Wrong code. Try again,hello 💗";
  }
}

document.getElementById("code").addEventListener("keydown", function (event) {
  if (event.key === "Enter") {
    checkCode();
  }
});
</script>
